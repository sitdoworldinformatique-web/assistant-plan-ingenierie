name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2-backend
    env:
      PYTHONPATH: .:../3-connecteurs-deploiement/connecteurs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 2-backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: pytest -q
      - name: Migrations Alembic cohérentes avec les modèles
        env:
          DATABASE_URL: sqlite:///./migration.db
        run: alembic upgrade head && alembic check

  connecteurs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3-connecteurs-deploiement/connecteurs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ../../2-backend/requirements.txt pytest ruff
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 1-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 1-frontend/package-lock.json
      - run: pip install -r 2-backend/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: 1-frontend
      - run: npx playwright install --with-deps chromium
        working-directory: 1-frontend
      - run: npx playwright test
        working-directory: 1-frontend
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: 1-frontend/playwright-report

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, connecteurs]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: 2-backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: 1-frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Le fichier compose de production est valide
        working-directory: 3-connecteurs-deploiement
        run: DOMAINE=ci.exemple.cd POSTGRES_PASSWORD=ci JWT_SECRET=0123456789012345678901234567890123456789 docker compose -f docker-compose.prod.yml config -q
