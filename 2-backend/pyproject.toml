[project]
name = "assistant-plan-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../3-connecteurs-deploiement/connecteurs"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E741", "B905", "B008"]  # B008 : idiome Depends() de FastAPI
