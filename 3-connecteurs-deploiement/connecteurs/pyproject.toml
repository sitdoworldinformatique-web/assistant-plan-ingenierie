[project]
name = "apiconnect"
version = "0.1.0"
description = "Connecteurs IA (Claude, Nano Banana) d'ASSISTANT PLAN INGÉNIERIE"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "anthropic>=0.40"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
