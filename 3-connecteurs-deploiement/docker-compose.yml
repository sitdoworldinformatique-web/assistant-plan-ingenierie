# Développement : docker compose up --build  (depuis 3-connecteurs-deploiement/)
name: assistant-plan-dev
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    ports: ["5432:5432"]
    volumes: [db-dev:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant"]
      interval: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: 2-backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /srv/backend/app --reload-dir /srv/connecteurs
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://assistant:assistant@db:5432/assistant
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ../2-backend:/srv/backend
      - ./connecteurs:/srv/connecteurs
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      API_CIBLE: http://backend:8000
    volumes:
      - ../1-frontend:/app
      - frontend-modules:/app/node_modules
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  db-dev:
  frontend-modules:
